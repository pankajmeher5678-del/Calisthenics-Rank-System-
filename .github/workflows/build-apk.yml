name: Build Calisthenics Tracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Extract Android project archives
        shell: bash
        run: |
          set -e

          found_zip=false

          while IFS= read -r zipfile; do
            echo "Extracting: $zipfile"
            mkdir -p extracted
            unzip -q "$zipfile" -d extracted
            found_zip=true
          done < <(find . -maxdepth 3 -type f -iname "*.zip" -print)

          if [ "$found_zip" = true ]; then
            cp -R extracted/. .
          fi

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(dirname "$(find . -type f -name settings.gradle.kts -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

            - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          rm -rf /tmp/gradle-wrapper
          mkdir -p /tmp/gradle-wrapper
          cd /tmp/gradle-wrapper

          gradle wrapper --gradle-version 9.5

          cp gradlew "${GITHUB_WORKSPACE}/${PROJECT_DIR}/gradlew"
          mkdir -p "${GITHUB_WORKSPACE}/${PROJECT_DIR}/gradle/wrapper"
          cp gradle/wrapper/* "${GITHUB_WORKSPACE}/${PROJECT_DIR}/gradle/wrapper/"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CalisthenicsTracker-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CalisthenicsTracker-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
